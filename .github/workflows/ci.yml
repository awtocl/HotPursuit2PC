name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Guard - no game data or user folders in the repository
        shell: pwsh
        run: |
          $bad = git ls-files | Where-Object {
            $_ -match '^(ROM|game)/' -or $_ -match '\.(iso|ISO|bin|BIN|BUN|LZC|IRX|IMG|ELF)$' -or $_ -match 'SLUS_'
          }
          if ($bad) { Write-Error "Forbidden files are tracked:`n$($bad -join "`n")"; exit 1 }
          Write-Host "OK: no game data tracked."

      - name: Fetch the pinned Play! core (BSD-2, not part of this repository)
        shell: pwsh
        run: pwsh tools/fetch-play.ps1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DHP2_WERROR=ON

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Upload converter binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hotpursuit2pc-windows-x64
          # The converter carries the launcher inside it; no game data is involved.
          path: |
            build/converter/Release/HotPursuit2PC.exe
            build/converter/Release/hp2pc-cli.exe
          if-no-files-found: error
