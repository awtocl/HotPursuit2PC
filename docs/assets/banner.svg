<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">HotPursuit2PC</title>
  <desc id="d">Project banner in the style of the game's menus: a blueprint grid, a brushed-steel strip with the project name in heavy italic silver letters, and a red rule.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#203d58" stroke-width="1.4"/>
    </pattern>
    <pattern id="grid4" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M 128 0 L 0 0 0 128" fill="none" stroke="#2c5476" stroke-width="1.6"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a7884"/>
      <stop offset="0.3" stop-color="#46535f"/>
      <stop offset="0.65" stop-color="#2a3540"/>
      <stop offset="1" stop-color="#131b23"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.15" stop-color="#e2e4e6"/>
      <stop offset="1" stop-color="#9ea2a6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="14" fill="#05080b"/>
  <rect width="1280" height="320" rx="14" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="14" fill="url(#grid4)"/>
  <rect width="1280" height="320" rx="14" fill="url(#vignette)"/>
  <!-- title strip -->
  <rect x="0" y="118" width="1280" height="76" fill="url(#steel)"/>
  <rect x="0" y="118" width="1280" height="34" fill="url(#shine)"/>
  <line x1="0" y1="118.5" x2="1280" y2="118.5" stroke="#dce6f0" stroke-opacity="0.45"/>
  <line x1="0" y1="193.5" x2="1280" y2="193.5" stroke="#000" stroke-opacity="0.8"/>
  <!-- rules -->
  <rect x="0" y="204" width="1280" height="4" fill="#b3141c"/>
  <rect x="140" y="213" width="1140" height="2" fill="#d8d8d8"/>
  <!-- title: heavy italic silver with a black outline -->
  <text x="96" y="186" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="104"
        transform="skewX(-17)" transform-origin="96 186" fill="url(#silver)" stroke="#000" stroke-width="11"
        stroke-linejoin="round" paint-order="stroke">HotPursuit2<tspan fill="#e47c08">PC</tspan></text>
  <!-- ticker -->
  <rect x="140" y="250" width="1140" height="40" fill="url(#steel)" opacity="0.95"/>
  <text x="168" y="279" font-family="Bahnschrift, Arial Narrow, Arial, sans-serif" font-weight="700" font-size="25"
        transform="skewX(-12)" transform-origin="168 279" fill="#d2d4d6" stroke="#000" stroke-width="4"
        stroke-linejoin="round" paint-order="stroke">PS2 game  ·  native Windows x64  ·  static recompilation  ·  your own disc</text>
</svg>
